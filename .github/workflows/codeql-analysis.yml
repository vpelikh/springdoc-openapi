name: "Code scanning - action"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 19 * * 1'

jobs:
  CodeQL-Build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build with Maven
        # CodeQL only needs the source built for analysis, so tests are skipped.
        # The maven-plugin's invoker ITs already run in the main Build workflow
        # (see the maven-install action used by build-and-test-plugins).
        uses: ./.github/actions/maven-install
        with:
          skip-tests: 'true'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4