name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        type: choice
        options:
          - milestone
          - rc
          - release
        default: 'release'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        with:
          cache-read-only: false

      - name: Compute release version
        id: version
        run: . ./CI/compute-release-version.sh ${{ github.event.inputs.release_type }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release commit (detached)
        run: . ./CI/prepare-release-commit.sh

      - name: Build and test plugins
        uses: ./.github/actions/build-and-test-plugins

      - name: Deploy to Maven Central
        if: success()
        run: ./mvnw --no-transfer-progress -B -T 1C -Dinvoker.skip=true -Prelease deploy

      - name: Publish Gradle plugin
        if: success()
        run: |
          cd ./springdoc-openapi-gradle-plugin
          ./gradlew publishPlugins -Pgradle.publish.key="${GRADLE_PUBLISH_KEY}" -Pgradle.publish.secret="${GRADLE_PUBLISH_SECRET}" --info --build-cache --parallel
          cd ../..

      - name: Tag and push release tag
        if: success()
        run: |
          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Create draft GitHub Release
        if: success()
        run: |
          # Determine base tag for release notes
          if [ "$IS_PRERELEASE" = "true" ]; then
            BASE_TAG=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')
          else
            BASE_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[0].tagName')
          fi
          TITLE="v${RELEASE_VERSION}"
          gh release create "v${RELEASE_VERSION}" \
            --title "$TITLE" \
            --notes-start-tag "$BASE_TAG" \
            --generate-notes \
            --draft \
            --prerelease="$IS_PRERELEASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Javadocs
        if: success()
        run: ./mvnw -pl springdoc-openapi-starter-common javadoc:javadoc -DskipTests

      - name: Prepare javadocs
        if: success()
        run: . ./CI/prepare-javadocs.sh

      - name: Bump SNAPSHOT version on master (final release only)
        if: success() && github.event.inputs.release_type == 'release'
        run: . ./CI/bump-snapshot.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Check out gh-pages into a separate path. A checkout into the workspace root
      # would swap the working tree to the gh-pages content (no .github), which makes
      # the composite "Build and test plugins" action's post step fail because its
      # action.yml metadata can no longer be found at job end.
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: "gh-pages"
          fetch-depth: 0
          path: gh-pages

      - name: Publish javadocs
        if: success()
        run: |
          cd gh-pages
          TMPDIR="$(dirname -- "${0}")"
          . $TMPDIR/publish-javadocs.sh

      - name: Publish draft release
        if: success()
        run: gh release edit "v${RELEASE_VERSION}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PRIVATE_PASSPHRASE }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}