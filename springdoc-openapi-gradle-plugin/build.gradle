// * * * * * * * * * * * *
// Plugins
// * * * * * * * * * * * *
plugins {
    id 'java-gradle-plugin'
    // Publishing publicly to plugins.gradle.org
    id 'com.gradle.plugin-publish' version '2.1.1'
    // Publishing to maven
    id 'maven-publish'
}

// * * * * * * * * * * * *
// Project configuration
// * * * * * * * * * * * *

group = 'io.github.vpelikh'

project.description = 'Gradle plugin that generates the OpenAPI specification for a Spring Boot app'
project.ext.pluginId = 'io.github.vpelikh.springdoc-openapi-gradle-plugin'
project.ext.scm      = 'https://github.com/vpelikh/springdoc-openapi.git'
project.ext.url      = 'https://github.com/vpelikh/springdoc-openapi/tree/main/springdoc-openapi-gradle-plugin'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava {
    options.release = 17
}

dependencies {
    implementation gradleApi()

    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

// Filter plugin version into the properties file at build time (like swagger plugin).
processResources {
    inputs.property 'pluginVersion', project.version
    filteringCharset = 'UTF-8'
    filesMatching('springdoc-openapi-gradle-plugin.properties') {
        expand(pluginVersion: project.version)
    }
}

// * * * * * * * * * * * *
// Plugin publishing
// * * * * * * * * * * * *

// Configuration for: com.gradle.plugin-publish
gradlePlugin {
    website = project.ext.url
    vcsUrl = project.ext.scm

    plugins {
        springdoc {
            id = project.ext.pluginId
            displayName = 'Springdoc OpenAPI Gradle Plugin'
            description = project.description
            implementationClass = 'org.springdoc.gradle.SpringDocOpenApiGradlePlugin'
            tags = ['springdoc', 'openapi', 'spring-boot', 'spring', 'api']
        }
    }
}

publishing {
    repositories {
        maven {
            url = mavenLocal().url
        }
    }
}

test {
    useJUnitPlatform()
    // Expose the resolved project version so the functional tests depend on the
    // artifacts that were actually built/installed (e.g. 5.1.0 at release time,
    // 5.1.0-SNAPSHOT during development) instead of a hardcoded version.
    systemProperty 'springdocVersion', project.version
}